parameters:
  stageName: ""
  environmentName: ""
  artifactName: ""
  databricksJobName: ""
  configRelPath: ""
  runIntegrationTests: true

stages:
  - stage: ${{ parameters.stageName }}
    displayName: "Deploy & Run on Databricks (${{ parameters.environmentName }})"
    dependsOn: Build
    jobs:
      - deployment: DeployDatabricks
        displayName: "Deploy to Databricks"
        environment: ${{ parameters.environmentName }}
        pool:
          vmImage: "ubuntu-latest"
        strategy:
          runOnce:
            deploy:
              steps:
                # Needed so we can run pytest from repo/tests and use requirements-dev.txt
                - checkout: self
                  displayName: "Checkout repository"

                - download: current
                  artifact: ${{ parameters.artifactName }}
                  displayName: "Download build artifact"

                - script: |
                    set -e
                    chmod +x "$(Pipeline.Workspace)/${{ parameters.artifactName }}/scripts/databricks_deploy_job.sh"
                    chmod +x "$(Pipeline.Workspace)/${{ parameters.artifactName }}/scripts/databricks_run_job.sh"
                  displayName: "Make deployment scripts executable"

                - script: |
                    set -euo pipefail

                    ART_DIR="$(Pipeline.Workspace)/${{ parameters.artifactName }}"
                    WHEEL_PATH="$(ls -1 ${ART_DIR}/dist/*.whl | head -n 1)"

                    echo "Artifact directory: ${ART_DIR}"
                    echo "Wheel path: ${WHEEL_PATH}"

                    # Required env vars are provided by Azure DevOps variables/variable-groups per environment:
                    # DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_CLUSTER_ID
                    export DATABRICKS_HOST="$(DATABRICKS_HOST)"
                    export DATABRICKS_TOKEN="$(DATABRICKS_TOKEN)"
                    export DATABRICKS_CLUSTER_ID="$(DATABRICKS_CLUSTER_ID)"

                    # Upload wheel to this DBFS location
                    export DBFS_WHEEL_PATH="dbfs:/FileStore/etl/${{ parameters.environmentName }}/$(Build.BuildNumber)/$(basename ${WHEEL_PATH})"

                    # Config inside downloaded artifact
                    export CONFIG_FILE="${ART_DIR}/${{ parameters.configRelPath }}"

                    # Job name unique per environment
                    export JOB_NAME="${{ parameters.databricksJobName }}-${{ parameters.environmentName }}"

                    # Deploy/Update job using artifact scripts + job-definition.json
                    "${ART_DIR}/scripts/databricks_deploy_job.sh" \
                      "${WHEEL_PATH}" \
                      "${DBFS_WHEEL_PATH}" \
                      "${ART_DIR}/databricks/job-definition.json" \
                      "${CONFIG_FILE}" \
                      "${JOB_NAME}"
                  displayName: "Deploy/Update Databricks Job"

                - script: |
                    set -euo pipefail
                    ART_DIR="$(Pipeline.Workspace)/${{ parameters.artifactName }}"

                    export DATABRICKS_HOST="$(DATABRICKS_HOST)"
                    export DATABRICKS_TOKEN="$(DATABRICKS_TOKEN)"
                    export JOB_NAME="${{ parameters.databricksJobName }}-${{ parameters.environmentName }}"

                    "${ART_DIR}/scripts/databricks_run_job.sh" "${JOB_NAME}"
                  displayName: "Run Databricks Job"

                # -------------------------------
                # Integration tests (optional)
                # -------------------------------
                - script: |
                    set -euo pipefail

                    if [ "${{ parameters.runIntegrationTests }}" != "true" ]; then
                      echo "Integration tests are disabled for this stage."
                      exit 0
                    fi

                    python -m pip install --upgrade pip
                    pip install -r requirements-dev.txt

                    # Provide env vars expected by tests/integration/test_databricks_job_run.py
                    export DATABRICKS_HOST="$(DATABRICKS_HOST)"
                    export DATABRICKS_TOKEN="$(DATABRICKS_TOKEN)"
                    export DATABRICKS_JOB_NAME="${{ parameters.databricksJobName }}-${{ parameters.environmentName }}"

                    pytest -m integration tests/integration
                  displayName: "Run integration tests (Databricks)"
